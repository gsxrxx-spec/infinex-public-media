name: INFINEX - dos carruseles diarios Instagram

on:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/Madrid'
    - cron: '15 9 * * *'
      timezone: 'Europe/Madrid'
    - cron: '0 17 * * *'
      timezone: 'Europe/Madrid'
    - cron: '15 17 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Comprobar sin publicar, publicar o revisar'
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - publish
          - verify
      slot:
        description: 'Franja 09 o 17'
        required: true
        default: '09'
        type: choice
        options:
          - '09'
          - '17'

permissions:
  contents: write

concurrency:
  group: infinex-instagram-diario
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      INFINEX_IG_TOKEN: ${{ secrets.INFINEX_IG_TOKEN }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (contains(fromJSON('["15 9 * * *","15 17 * * *"]'), github.event.schedule) && 'verify' || 'publish') }}
      INFINEX_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || (contains(fromJSON('["0 17 * * *","15 17 * * *"]'), github.event.schedule) && '17' || '09') }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencia grafica
        run: python -m pip install 'Pillow>=11.0,<13'
      - name: Comprobar y ejecutar INFINEX
        run: python scripts/infinex_daily.py "$MODE"
