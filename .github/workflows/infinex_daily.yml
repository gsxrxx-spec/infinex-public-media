name: INFINEX - publicacion y recuperacion Instagram

on:
  push:
    paths:
      - '.github/workflows/infinex_daily.yml'
      - 'scripts/infinex_daily.py'
      - 'scripts/infinex_carousel_quality.py'
      - 'scripts/infinex_autorepair.py'
      - 'scripts/infinex_before_after.py'
      - 'scripts/infinex_prepare_before_after.py'
      - 'tests/test_infinex_before_after.py'
      - 'scripts/infinex_gate_geometry_qa.py'
      - 'tests/test_infinex_gate_fit.py'
      - 'tests/test_infinex_weekly_seven.py'
      - 'assets/before_after/**/sources.json'
      - 'tests/test_infinex_autorepair.py'
      - 'tests/test_infinex_premium_stock.py'
      - 'assets/photo_library.json'
      - 'tests/test_infinex_carousel_originality.py'
      - 'scripts/infinex_weekly_plan.py'
      - 'tests/test_infinex_morning_reels.py'
      - 'scripts/infinex_facebook.py'
      - 'tests/test_infinex_facebook.py'
      - 'tests/test_infinex_editorial.py'
      - 'tests/test_infinex_editorial_policy.py'
      - 'scripts/infinex_editorial_policy.py'
  schedule:
    # Mantener la ultima franja antigua del sábado 21/11/2026 exclusivamente.
    - cron: '0 17 21 11 *'
      timezone: 'Europe/Madrid'
    - cron: '30 9 * * *'
      timezone: 'Europe/Madrid'
    - cron: '45 9 * * *'
      timezone: 'Europe/Madrid'
    # Recuperacion independiente del PC si GitHub retrasa el disparador.
    - cron: '5,25,45 10 * * *'
      timezone: 'Europe/Madrid'
    - cron: '15 12 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Dry run, recuperar pendientes, publicar turno o verificar'
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - recover
          - publish
          - verify
      slot:
        description: 'Franja 09 o 17 (no aplicable a recover)'
        required: true
        default: '09'
        type: choice
        options:
          - '09'
          - '17'

permissions:
  contents: write

concurrency:
  group: infinex-instagram-exclusive
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      INFINEX_IG_TOKEN: ${{ secrets.INFINEX_IG_TOKEN }}
      INFINEX_FB_PAGE_TOKEN: ${{ secrets.INFINEX_FB_PAGE_TOKEN }}
      MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '0 17 21 11 *' && 'publish' || github.event_name == 'workflow_dispatch' && inputs.mode || github.event_name == 'push' && 'dry_run' || 'recover' }}
      INFINEX_SLOT: ${{ github.event_name == 'schedule' && github.event.schedule == '0 17 21 11 *' && '17' || github.event_name == 'workflow_dispatch' && inputs.slot || '09' }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencia grafica
        run: python -m pip install 'Pillow>=11.0,<13'
      - name: Pruebas de seguridad del espejo Facebook
        run: python tests/test_infinex_facebook.py
      - name: Validar tema unico, fotos y CTA en cada franja
        run: python tests/test_infinex_editorial.py
      - name: Comprobar temas consecutivos y detalles por diapositiva
        run: python tests/test_infinex_editorial_policy.py
      - name: Prohibir imágenes reutilizadas y titulares repetidos
        run: python tests/test_infinex_carousel_originality.py
      - name: Comprobar plan de 14 publicaciones y no repetir Reels
        run: python tests/test_infinex_morning_reels.py
      - name: Validar autorreparación de fotos, textos y temas sin repetir
        run: python tests/test_infinex_autorepair.py
      - name: Comprobar siete publicaciones 2+3+2 y antes/despues
        run: python tests/test_infinex_weekly_seven.py
      - name: Validar encaje real de puertas a pilares y umbral, sin publicar
        run: python tests/test_infinex_gate_fit.py
      - name: Validar montajes y originales antes/despues sin publicar
        run: python tests/test_infinex_before_after.py
      - name: Verificar seis fotos nuevas de calidad para informativos
        run: python tests/test_infinex_premium_stock.py
      - name: Publicador de carrusel informativo (solo lunes/viernes)
        run: python scripts/infinex_daily.py "$MODE"
      - name: Publicador antes y despues (solo martes/jueves/domingo)
        run: python scripts/infinex_before_after.py "$MODE"
      - name: Validacion del nuevo formato sin publicar
        if: ${{ github.event_name == 'push' }}
        run: python scripts/infinex_before_after.py dry_run
      - name: Sincronizar Facebook con el carrusel verificado de Instagram
        if: ${{ vars.INFINEX_FB_SYNC_ENABLED == 'true' && (env.MODE == 'recover' || env.MODE == 'publish' || (env.MODE == 'dry_run' && github.event_name == 'workflow_dispatch')) }}
        run: python scripts/infinex_facebook.py "$MODE"
