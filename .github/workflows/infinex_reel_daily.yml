name: INFINEX - 2 Reels semanales en calendario 14 posts

on:
  push:
    paths:
      - '.github/workflows/infinex_reel_daily.yml'
      - 'scripts/infinex_reel_morning.py'
      - 'scripts/infinex_weekly_plan.py'
      - 'scripts/infinex_reel_uniqueness.py'
      - 'assets/reels/NEVER_REUSE.json'
      - 'tests/test_infinex_morning_reels.py'
      - 'assets/reels/**/sources.json'
      - 'ops/reel_clock_ping.json'
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/Madrid'
    # Reintentos no duplicados por si GitHub retrasa o pierde una ejecucion
    - cron: '9,19,29,39,49 9 * * *'
      timezone: 'Europe/Madrid'
    - cron: '13,33,53 10 * * *'
      timezone: 'Europe/Madrid'
    # Dos Reels por semana: lunes 09 y jueves 17, previa comprobacion calendario.
    - cron: '0 17 * * *'
      timezone: 'Europe/Madrid'
    - cron: '9,19,39,59 17 * * *'
      timezone: 'Europe/Madrid'
    - cron: '13,33 18 * * *'
      timezone: 'Europe/Madrid'
    # Recuperacion si el PC estuvo apagado o se perdieron lanzamientos
    - cron: '17 11-23 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: infinex-instagram-diario
  cancel-in-progress: false

jobs:
  reels_programados:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      INFINEX_IG_TOKEN: ${{ secrets.INFINEX_IG_TOKEN }}
    steps:
      - name: Recuperar proyecto
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar 12 carruseles, 2 Reels, 14 franjas y prohibir reutilizar vídeo
        run: python tests/test_infinex_morning_reels.py
      - name: Verificacion editorial sin publicar
        run: python scripts/infinex_reel_morning.py dry_run
      - name: Publicar Reel verificado solo cuando corresponda
        run: python scripts/infinex_reel_morning.py publish
