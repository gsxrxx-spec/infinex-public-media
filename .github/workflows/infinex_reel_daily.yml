name: INFINEX - 2 Reels por semana (miercoles y sabado 09:30)

on:
  push:
    paths:
      - '.github/workflows/infinex_reel_daily.yml'
      - 'scripts/infinex_reel_morning.py'
      - 'scripts/infinex_weekly_plan.py'
      - 'scripts/infinex_reel_uniqueness.py'
      - 'assets/reels/NEVER_REUSE.json'
      - 'tests/test_infinex_morning_reels.py'
      - 'tests/test_infinex_weekly_seven.py'
      - 'assets/reels/**/sources.json'
      - 'ops/reel_clock_ping.json'
  schedule:
    # Excepcion transitoria: el sábado 21/11 conserva Reel de las 09:00.
    - cron: '0 9 21 11 *'
      timezone: 'Europe/Madrid'
    - cron: '30 9 * * *'
      timezone: 'Europe/Madrid'
    - cron: '45 9 * * *'
      timezone: 'Europe/Madrid'
    - cron: '5,25,45 10 * * *'
      timezone: 'Europe/Madrid'
    - cron: '15 12 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: infinex-instagram-exclusive
  cancel-in-progress: false

jobs:
  reels_programados:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      INFINEX_IG_TOKEN: ${{ secrets.INFINEX_IG_TOKEN }}
    steps:
      - name: Recuperar proyecto
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar Reels originales sin reutilizar
        run: python tests/test_infinex_weekly_seven.py
      - name: Validar programacion semanal de Reels
        run: python tests/test_infinex_morning_reels.py
      - name: Verificacion editorial sin publicar
        run: python scripts/infinex_reel_morning.py dry_run
      - name: Publicar Reel verificado solo cuando corresponda
        run: python scripts/infinex_reel_morning.py publish
